name: ontobranch
channels:
  # 使用中科大 (USTC) 镜像源
  - https://mirrors.ustc.edu.cn/anaconda/cloud/pytorch/
  - https://mirrors.ustc.edu.cn/anaconda/cloud/conda-forge/
  - https://mirrors.ustc.edu.cn/anaconda/pkgs/main/
  - https://mirrors.ustc.edu.cn/anaconda/pkgs/free/
  - nodefaults

dependencies:
  # Core Python
  - python=3.10
  
  # PyTorch for Apple Silicon (移除 pytorch:: 前缀以确保走镜像源)
  - pytorch
  - torchvision 
  - torchaudio
  
  # Scientific computing & Data handling
  - numpy
  - scipy
  - scikit-learn
  - pandas
  - networkx
  
  # SCIP & Optimization
  - ecole>=0.8.1
  - pyscipopt
  
  # Visualization & Development
  - matplotlib
  - seaborn
  - jupyter
  - ipython
  - tqdm
  - pyyaml
  
  # Essential tools
  - pip
  - git
  
  # Pip installations
  - pip:
    # 针对当前环境的 pip 使用中科大 PyPI 镜像
    - -i https://pypi.mirrors.ustc.edu.cn/simple/
    
    # PyTorch Geometric
    - torch-geometric
    - torch-scatter
    - torch-sparse  
    - torch-cluster
    - torch-spline-conv
    
    # Experiment tracking & configs
    - wandb
    - tensorboard
    - hydra-core
    
    # Development tools
    - rich
    - click
    - pytest
    - black
    - isort
    - flake8